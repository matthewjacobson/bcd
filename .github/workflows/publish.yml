name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# OIDC token for npm Trusted Publishing (no NPM_TOKEN secret needed). It also
# attaches build provenance automatically.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing requires npm >= 11.5.1 (Node 20 ships npm 10.x).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      # On a tag push, make sure the tag matches the package version.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      # Auth comes from the OIDC trust configured on npmjs.com for this repo +
      # workflow; `prepublishOnly` builds the dist and provenance is automatic.
      - run: npm publish
